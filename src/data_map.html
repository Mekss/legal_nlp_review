<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>data map — what the corpus can answer</title>
<style>
  :root {
    --bg0:#0b1020; --bg1:#101832;
    --panel:rgba(255,255,255,.055); --panel-border:rgba(255,255,255,.10);
    --text:#e8ecf8; --dim:#9aa5c4; --faint:#6b7699;
    --b1:#3987e5; --b2:#1fae7c; --b3:#9085e9; --b4:#e0a43a; --refuse:#e66767;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--sans);color:var(--text);
    background:
      radial-gradient(1100px 600px at 12% -8%, rgba(57,135,229,.16), transparent 60%),
      radial-gradient(900px 550px at 92% 4%, rgba(31,174,124,.12), transparent 55%),
      radial-gradient(900px 700px at 60% 112%, rgba(144,133,233,.10), transparent 60%),
      linear-gradient(180deg,var(--bg0),var(--bg1));
    background-attachment:fixed}

  header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;
    padding:12px 20px;background:rgba(11,16,32,.66);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--panel-border)}
  .logo{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
    font-size:17px;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 4px 16px rgba(57,135,229,.4)}
  .htext h1{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;
    background:linear-gradient(90deg,#dfe4ff,#9be8dc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .htext .sub{font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap}
  header .spacer{flex:1}
  .search{display:flex;align-items:center;gap:7px;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:9px;padding:6px 11px}
  .search input{background:transparent;border:none;outline:none;color:var(--text);
    font-family:var(--sans);font-size:12.5px;width:170px}
  .search input::placeholder{color:var(--faint)}
  .search svg{width:13px;height:13px;stroke:var(--faint);fill:none;stroke-width:2}
  .btn{font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--panel-border);
    padding:7px 12px;border-radius:9px;cursor:pointer;transition:all .15s;white-space:nowrap}
  .btn:hover{color:var(--text);border-color:var(--b1)}

  .legend{position:fixed;left:18px;bottom:18px;z-index:15;background:rgba(17,24,48,.82);
    border:1px solid var(--panel-border);border-radius:12px;padding:11px 13px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .legend .lt{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);margin-bottom:7px}
  .legend .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
    padding:3px 5px;border-radius:6px;cursor:pointer;transition:background .12s}
  .legend .row:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .legend .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .legend .row.off{opacity:.35}

  #stage{position:fixed;inset:0;z-index:1;cursor:grab;width:100vw;height:100vh;display:block}
  #stage.panning{cursor:grabbing}
  .link{stroke:rgba(154,165,196,.22);stroke-width:1.2}
  .link.hl{stroke:rgba(232,236,248,.65);stroke-width:1.9}
  .node circle{stroke:rgba(11,16,32,.65);stroke-width:2;cursor:pointer}
  .node.sel circle{stroke:#fff;stroke-width:2.6}
  .node.dim{opacity:.2}
  .node.collapsed circle{stroke-dasharray:2.5 2.5}
  .node text{fill:var(--text);paint-order:stroke;stroke:rgba(11,16,32,.9);stroke-width:3.2;
    stroke-linejoin:round;-webkit-user-select:none;user-select:none;pointer-events:none}
  .node text .count{fill:var(--dim)}

  #panel{position:fixed;top:58px;right:14px;width:322px;max-height:calc(100vh - 132px);z-index:16;
    background:rgba(17,24,48,.9);border:1px solid var(--panel-border);border-radius:16px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 16px 50px rgba(0,0,0,.5);
    overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,opacity .25s;opacity:1}
  #panel.hidden{transform:translateX(360px);opacity:0;pointer-events:none}
  .p-head{padding:15px 17px 12px;border-bottom:1px solid var(--panel-border)}
  .p-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;border:1px solid;margin-bottom:9px}
  .p-title{font-size:16.5px;font-weight:700;line-height:1.25;word-break:break-word}
  .p-kind{font-size:11px;color:var(--faint);margin-top:3px}
  .p-body{padding:14px 17px;overflow-y:auto}
  .p-desc{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:13px}
  .p-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .stat{flex:1;min-width:76px;background:rgba(0,0,0,.25);border:1px solid var(--panel-border);
    border-radius:10px;padding:9px 11px}
  .stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .p-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);margin:4px 0 8px}
  .vlist{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .vrow{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .vrow .bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
  .vrow .bar i{display:block;height:100%;border-radius:4px}
  .vrow .lab{min-width:74px;color:var(--dim);font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vrow .n{min-width:34px;text-align:right;color:var(--faint);font-variant-numeric:tabular-nums}
  .p-ex{background:rgba(255,255,255,.04);border:1px solid var(--panel-border);border-radius:11px;padding:11px 13px;margin-top:4px}
  .p-ex .exlab{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);margin-bottom:5px}
  .p-ex .exq{font-size:13px;line-height:1.5;color:var(--text)}
  .p-note{font-size:11px;color:var(--faint);font-style:italic;margin-top:11px;line-height:1.5}

  .hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:14;font-size:11.5px;
    color:var(--faint);background:rgba(11,16,32,.6);border:1px solid var(--panel-border);border-radius:999px;
    padding:6px 15px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
  .lag{position:fixed;right:14px;bottom:18px;z-index:15;max-width:322px;font-size:11px;line-height:1.5;
    color:#f5c86b;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:11px;padding:9px 12px}
  @media (max-width:720px){#panel{width:calc(100vw - 28px)}.search input{width:110px}.lag{display:none}}
</style>
</head>
<body>

<header>
  <div class="logo">🗺️</div>
  <div class="htext">
    <h1>data map — what the corpus can answer</h1>
    <div class="sub" id="sub">loading…</div>
  </div>
  <div class="spacer"></div>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <input id="search" placeholder="find a field or value…" autocomplete="off">
  </div>
  <button class="btn" id="expandBtn">expand all</button>
  <button class="btn" id="resetBtn">reset view</button>
</header>

<svg id="stage"><g id="scene"><g id="links"></g><g id="nodes"></g></g></svg>

<div class="legend" id="legend">
  <div class="lt">answer buckets — click to focus</div>
  <div class="row" data-bucket="b1"><span class="dot" style="background:var(--b1)"></span>grounded retrieval + citations</div>
  <div class="row" data-bucket="b2"><span class="dot" style="background:var(--b2)"></span>metadata · NL→SQL</div>
  <div class="row" data-bucket="b3"><span class="dot" style="background:var(--b3)"></span>extracted · calibrated</div>
  <div class="row" data-bucket="b4"><span class="dot" style="background:var(--b4)"></span>wording over time · diachronic</div>
  <div class="row" data-bucket="refuse"><span class="dot" style="background:var(--refuse)"></span>refuses (not extracted)</div>
</div>

<div id="panel" class="hidden"></div>
<div class="hint" id="hint">drag nodes · scroll to zoom · drag background to pan · click a node to open it</div>

function step(){
  const vis=visNodes();
  for(let i=0;i<vis.length;i++){const a=vis[i];
    for(let j=i+1;j<vis.length;j++){const b=vis[j];
      let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy; if(d2<1){d2=1;dx=Math.random()-.5;dy=Math.random()-.5;}
      const d=Math.sqrt(d2),f=Math.min(REP/d2,MAXREP)*alpha,fx=dx/d*f,fy=dy/d*f;
      a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}}
  visLinks(vis).forEach(({s,t})=>{let dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1;
    const f=(d-REST[Math.min(t.level,4)])*SPRING*alpha,fx=dx/d*f,fy=dy/d*f;
    s.vx+=fx;s.vy+=fy;t.vx-=fx;t.vy-=fy;});
  vis.forEach(n=>{
    if(n===root){n.x=0;n.y=0;n.vx=0;n.vy=0;return;}
    if(n.fx!==null){n.x=n.fx;n.y=n.fy;n.vx=0;n.vy=0;return;}
    n.vx+=(-n.x)*GRAV*alpha; n.vy+=(-n.y)*GRAV*alpha;
    n.vx*=DAMP; n.vy*=DAMP;
    n.vx=Math.max(-VMAX,Math.min(VMAX,n.vx)); n.vy=Math.max(-VMAX,Math.min(VMAX,n.vy));
    n.x+=n.vx; n.y+=n.vy;});
  alpha*=0.985; if(alpha<0.05)alpha=0.05;
}
function reheat(v){alpha=Math.max(alpha,v||0.9);}

/* ---------- DOM render ---------- */
const stage=document.getElementById("stage"),scene=document.getElementById("scene"),
  gLinks=document.getElementById("links"),gNodes=document.getElementById("nodes");
let W=innerWidth,H=innerHeight,view={k:1,tx:W/2,ty:H/2};
let selected=null,hovered=null,focusBucket=null,structSig="",linkEls=[];

function fsOf(n){return n.level===0?15:n.level===1?13.5:n.level===2?12:n.level>=4?10:11;}
function buildNodeEl(n){
  const g=document.createElementNS(SVGNS,"g"); g.dataset.uid=n.uid;
  const c=document.createElementNS(SVGNS,"circle"); c.setAttribute("r",rOf(n));
  const isVal=n.kind==="value";
  c.setAttribute("fill", isVal?"rgba(255,255,255,.10)":BUCKET_COLOR[n.bucket]);
  if(isVal) c.setAttribute("stroke",BUCKET_COLOR[n.bucket]);
  const t=document.createElementNS(SVGNS,"text");
  const fs=fsOf(n); t.setAttribute("x",rOf(n)+5); t.setAttribute("y",fs*0.35);
  t.setAttribute("font-size",fs); t.setAttribute("font-weight",n.level<=1?700:n.level===2?600:400);
  t.appendChild(document.createTextNode(n.label));
  if(isVal&&n.count!=null){const sp=document.createElementNS(SVGNS,"tspan");
    sp.setAttribute("class","count"); sp.textContent="  "+n.count.toLocaleString(); t.appendChild(sp);}
  g.appendChild(c); g.appendChild(t); n.el={g,c,t}; return g;
}
function rebuild(vis){
  gNodes.textContent=""; gLinks.textContent=""; linkEls=[];
  vis.forEach(n=>gNodes.appendChild(buildNodeEl(n)));
  visLinks(vis).forEach(lk=>{const ln=document.createElementNS(SVGNS,"line");
    ln.setAttribute("class","link"); gLinks.appendChild(ln); linkEls.push({ln,...lk});});
}
function frame(){
  step();
  const vis=visNodes();
  const sig=vis.map(n=>n.uid).join(",");
  if(sig!==structSig){structSig=sig; rebuild(vis);}
  scene.setAttribute("transform",`translate(${view.tx},${view.ty}) scale(${view.k})`);
  vis.forEach(n=>{
    const g=n.el.g;
    g.setAttribute("transform",`translate(${n.x.toFixed(2)},${n.y.toFixed(2)})`);
    const canExp=n.children.length>0, dim=focusBucket&&n.bucket!==focusBucket&&n.bucket!=="root";
    let cls="node"; if(canExp)cls+=n.expanded?" open":" collapsed";
    if(n===selected)cls+=" sel"; if(dim)cls+=" dim";
    if(g.getAttribute("class")!==cls) g.setAttribute("class",cls);
    // flip label to the outward side so text points away from the graph centre
    const left=n.level>0 && n.x<0, want=left?"end":"start";
    if(n.el.side!==want){n.el.side=want; const off=left?-(rOf(n)+6):(rOf(n)+6);
      n.el.t.setAttribute("text-anchor",want); n.el.t.setAttribute("x",off);}
  });
  linkEls.forEach(({ln,s,t})=>{
    ln.setAttribute("x1",s.x.toFixed(2)); ln.setAttribute("y1",s.y.toFixed(2));
    ln.setAttribute("x2",t.x.toFixed(2)); ln.setAttribute("y2",t.y.toFixed(2));
    const hl=hovered&&(hovered===s||hovered===t);
    ln.setAttribute("class",hl?"link hl":"link");
  });
  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
function toScene(px,py){return {x:(px-view.tx)/view.k,y:(py-view.ty)/view.k};}
let drag=null,panning=false,panStart=null,moved=false,userMoved=false;
function fitView(pad=110){
  const vis=visNodes(); if(vis.length<2)return;
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  vis.forEach(n=>{a=Math.min(a,n.x);c=Math.max(c,n.x);b=Math.min(b,n.y);d=Math.max(d,n.y);});
  const w=(c-a)||1,h=(d-b)||1;
  view.k=Math.min(2.4,Math.max(0.3,Math.min((W-2*pad)/w,(H-2*pad-70)/h)));
  view.tx=W/2-((a+c)/2)*view.k; view.ty=(H/2+22)-((b+d)/2)*view.k;
}
stage.addEventListener("pointerdown",e=>{
  userMoved=true;
  const g=e.target.closest(".node");
  if(g){const n=BYID.get(g.dataset.uid); drag={n}; moved=false; n.fx=n.x; n.fy=n.y;
    stage.setPointerCapture(e.pointerId);}
  else{panning=true; panStart={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty};
    stage.classList.add("panning"); moved=false; stage.setPointerCapture(e.pointerId);}
});
stage.addEventListener("pointermove",e=>{
  if(drag){const p=toScene(e.clientX,e.clientY); drag.n.fx=p.x; drag.n.fy=p.y; drag.n.x=p.x; drag.n.y=p.y;
    moved=true; reheat(0.5);}
  else if(panning){view.tx=panStart.tx+(e.clientX-panStart.x); view.ty=panStart.ty+(e.clientY-panStart.y);
    if(Math.abs(e.clientX-panStart.x)+Math.abs(e.clientY-panStart.y)>3)moved=true;}
  const g=e.target.closest(".node"); hovered=g?BYID.get(g.dataset.uid):null;
});
stage.addEventListener("pointerup",e=>{
  if(drag){const n=drag.n; if(!moved){n.fx=null;n.fy=null; nodeClick(n);} drag=null;}
  if(panning){panning=false; stage.classList.remove("panning");}
  hideHint();
});
stage.addEventListener("wheel",e=>{e.preventDefault(); userMoved=true;
  const nk=Math.min(3.2,Math.max(0.25,view.k*Math.exp(-e.deltaY*0.0012))),mx=e.clientX,my=e.clientY;
  view.tx=mx-(mx-view.tx)*(nk/view.k); view.ty=my-(my-view.ty)*(nk/view.k); view.k=nk;
},{passive:false});
function nodeClick(n){if(n.children.length){n.expanded=!n.expanded; reheat(0.95);} selected=n; showPanel(n); hideHint();}

/* ---------- panel ---------- */
const panel=document.getElementById("panel");
const KIND={root:"entry point",bucket:"answer bucket",source:"source corpus",table:"metadata table",
  field:"queryable field",cfield:"calibrated content field",topic:"diachronic topic",gap:"not extracted",value:"value"};
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function showPanel(n){
  const col=BUCKET_COLOR[n.bucket],raw=n.raw,s=[];
  if(raw.count!=null)s.push(["count",raw.count.toLocaleString()]);
  if(n.kind==="value"&&n.count!=null)s.push(["cases",n.count.toLocaleString()]);
  if(raw.coverage!=null)s.push(["coverage",raw.coverage+"%"]);
  if(raw.n_distinct!=null)s.push(["distinct",raw.n_distinct]);
  const stats=s.length?`<div class="p-stats">${s.map(([k,v])=>`<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")}</div>`:"";
  let vals="";const vv=raw.values||[];
  if(vv.length&&n.kind!=="value"){const max=Math.max(...vv.map(x=>x[1]));
    vals=`<div class="p-sec">values${raw.n_distinct>vv.length?` · top ${vv.length} of ${raw.n_distinct}`:""}</div><div class="vlist">`+
      vv.map(([lab,ct])=>`<div class="vrow"><span class="lab">${esc(lab)}</span><span class="bar"><i style="width:${Math.max(4,100*ct/max)}%;background:${col}"></i></span><span class="n">${ct.toLocaleString()}</span></div>`).join("")+`</div>`;}
  let child="";
  if(n.children.length&&n.kind!=="field"&&n.kind!=="cfield")
    child=`<div class="p-note">${n.expanded?"▾ expanded":"▸ collapsed"} — ${n.children.length} ${n.kind==="bucket"?"paths":n.kind==="table"?"fields":"items"} (click the node to ${n.expanded?"collapse":"expand"})</div>`;
  else if((n.kind==="field"||n.kind==="cfield")&&n.children.length)
    child=`<div class="p-note">${n.expanded?"▾ values spread on the canvas":"▸ click the node to spread its values on the canvas"}</div>`;
  const ex=raw.example?`<div class="p-ex"><div class="exlab">try asking</div><div class="exq">"${esc(raw.example)}"</div></div>`:"";
  const note=raw.note?`<div class="p-note">${esc(raw.note)}</div>`:"";
  panel.innerHTML=`<div class="p-head">
      <span class="p-badge" style="color:${col};border-color:${col}66;background:${col}1a">${n.bucket==="root"?"start":(BUCKET_LABEL[n.bucket]||KIND[n.kind])}</span>
      <div class="p-title">${esc(n.label)}</div><div class="p-kind">${KIND[n.kind]||n.kind}</div></div>
    <div class="p-body">${raw.desc?`<div class="p-desc">${esc(raw.desc)}</div>`:""}${stats}${vals}${ex}${note}${child}</div>`;
  panel.classList.remove("hidden");
}
panel.addEventListener("pointerdown",e=>e.stopPropagation());

/* ---------- legend / search / buttons ---------- */
document.querySelectorAll(".legend .row").forEach(row=>row.addEventListener("click",()=>{
  const b=row.dataset.bucket; focusBucket=focusBucket===b?null:b;
  document.querySelectorAll(".legend .row").forEach(r=>r.classList.toggle("off",focusBucket&&r.dataset.bucket!==focusBucket));
}));
const search=document.getElementById("search");
search.addEventListener("keydown",e=>{if(e.key!=="Enter")return;
  const q=search.value.trim().toLowerCase(); if(!q)return;
  const hit=NODES.find(n=>n.label.toLowerCase().includes(q));
  if(!hit){search.placeholder="no match — try 'canton', 'outcome'…"; search.value=""; return;}
  let p=hit.parent; while(p){p.expanded=true; p=p.parent;} if(hit.children.length)hit.expanded=true;
  reheat(0.95); selected=hit; showPanel(hit);
  setTimeout(()=>{view.k=1.15; view.tx=W/2-hit.x*view.k; view.ty=H/2-hit.y*view.k;},280);
});
let allOpen=false;
document.getElementById("expandBtn").addEventListener("click",e=>{
  allOpen=!allOpen; NODES.forEach(n=>{if(n.children.length)n.expanded=allOpen;}); root.expanded=true;
  e.target.textContent=allOpen?"collapse all":"expand all"; reheat(1); setTimeout(fitView,700);});
document.getElementById("resetBtn").addEventListener("click",()=>{
  focusBucket=null; userMoved=false;
  document.querySelectorAll(".legend .row").forEach(r=>r.classList.remove("off"));
  reheat(0.8); setTimeout(fitView,500);});
addEventListener("resize",()=>{W=innerWidth;H=innerHeight;});
let hintTimer=setTimeout(hideHint,9000);
function hideHint(){const h=document.getElementById("hint"); if(h)h.style.opacity=0; clearTimeout(hintTimer);}

/* ---------- boot ---------- */
document.getElementById("sub").textContent=`${DATA.buckets.length} answer buckets · click to explore · generated ${DATA.generated.replace("T"," ")}`;
const lag=document.createElement("div"); lag.className="lag";
lag.textContent=DATA.banner||"";
lag.style.color="#7fdcaa"; lag.style.background="rgba(52,211,153,.08)"; lag.style.borderColor="rgba(52,211,153,.3)";
document.body.appendChild(lag);
requestAnimationFrame(frame);
// settle, then fit the whole graph to the viewport (unless the user grabbed it first)
setTimeout(()=>{ if(!userMoved) fitView(); },1500);
// deep link: #open=<field-or-value> expands to that node and opens its panel
(function(){const m=/open=([^&]+)/.exec(location.hash); if(!m)return;
  const q=decodeURIComponent(m[1]).toLowerCase();
  const hit=NODES.find(n=>n.label.toLowerCase()===q)||NODES.find(n=>n.label.toLowerCase().includes(q));
  if(!hit)return; let p=hit.parent; while(p){p.expanded=true; p=p.parent;}
  if(hit.children.length)hit.expanded=true; selected=hit; userMoved=true;
  reheat(1); showPanel(hit);
  setTimeout(()=>{view.k=1.25; view.tx=W/2-hit.x*view.k-170; view.ty=H/2-hit.y*view.k;},600);
})();
</script>
</body>
</html>
